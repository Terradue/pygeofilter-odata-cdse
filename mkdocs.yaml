site_name: pygeofilter CDSE OData support for CQL2
site_url: https://terradue.github.io/pygeofilter-odata-cdse/
site_author: Fabrice Brito, Simone Tripodi
repo_url: https://github.com/Terradue/pygeofilter-odata-cdse
repo_name: Terradue/pygeofilter-odata-cdse

theme:
    logo: imgs/icon-eoap.png
    name: readthedocs


plugins:
  - search
  - mermaid2:
      version: 11.4.1
  - mkdocs-jupyter:
      execute: false
      show_input: True
      no_input: False

markdown_extensions:
  - pymdownx.details
  - abbr
  - admonition
  - footnotes
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - attr_list
  - pymdownx.snippets:
      base_path: './'
  - pymdownx.highlight:
      line_spans: __span

nav:
  - Home: index.md
  - Tutorials:
    - Translate your first filter: tutorials/first-filter.md
  - How-to guides:
    - Search the catalogue: how-to/search.md
    - Convert responses: how-to/convert.md
    - Develop and preview documentation: how-to/develop.md
  - Reference:
    - Python API: reference/api.md
    - Operators: reference/operators.md
    - Attributes: attributes.md
    - CLI: cli.md
    - OData-STAC crosswalk: odata-stac-crosswalk.md
    - Container builds: reference/containers.md
    - Example notebooks:
      - Catalogue search: catalogue-search.ipynb
      - Logical and comparison operators: logical_comparison_op.ipynb
      - Spatial operators: geographical_op.ipynb
      - Temporal operators: temporal_op.ipynb
  - Explanation:
    - Translation and conversion: explanation/architecture.md

copyright: <a href="https://www.apache.org/licenses/LICENSE-2.0"><img src="https://img.shields.io/badge/license-Apache%20License%202.0-blue" alt="Apache License, Version 2.0" /></a>
