[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygeofilter-odata-cdse"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Fabrice Brito", email = "fabrice.brito@terradue.com" },
  { name = "Simone Tripodi", email = "simone.tripodi@terradue.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "geojson==3.2.0",
  "pystac @ git+https://github.com/Terradue/pystac.git@t2_extensions",
  "click==8.3.1",
  "pygeofilter==0.4.0",
  "shapely==2.1.2",
  "loguru==0.7.3",
  "httpx==0.28.1"
]

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Documentation = "https://terradue.github.io/pygeofilter-odata-cdse/"
Issues = "https://github.com/Terradue/pygeofilter-odata-cdse/issues"
Source = "https://github.com/Terradue/pygeofilter-odata-cdse"

[project.scripts]
odata-client = "pygeocdse.cli:main"

[tool.hatch.version]
path = "src/pygeocdse/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pygeocdse"]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy==1.19.1",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/pygeocdse tests}"

[tool.coverage.run]
source_pkgs = ["pygeocdse", "tests"]
branch = true
parallel = true
omit = [
  "src/pygeocdse/__about__.py",
]

[tool.coverage.paths]
pygeocdse = ["src/pygeocdse", "*/pygeocdse/src/pygeocdse"]
tests = ["tests", "*/pygeocdse/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.envs.test]
skip-install = false
dependencies = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
]

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
testv = "pytest --verbose {args:tests}"
test-cov = "pytest --cov=pygeocdse --cov-report=term-missing {args:tests}"
test-show-setup = "pytest --setup-show"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.dev]
skip-install = false
dependencies = [
  "pytest>=8.4,<10",
  "mypy>=2.3.0",
  "ruff>=0.16.0",
  "bandit>=1.9.4",
]

[tool.ruff.lint]
# Start with the essential rules
select = [
  "F",    # Pyflakes (Critical for bugs)
  "E",    # pycodestyle Errors
  "W",    # pycodestyle Warnings
  "I",    # isort (Import sorting)
  "UP",   # pyupgrade (Modern syntax)
  "B",    # flake8-bugbear (Common bugs)
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "FA",   # flake8-future-annotations
  "TC",   # flake8-type-checking
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "C90",  # McCabe Complexity (Enables C901)
]

# Ignore rules that conflict with the formatter (Ruff Format/Black)
ignore = [
  "E501", # Line too long (handled by formatter)
  "W191", # Tab indentation (handled by formatter)
  "E111", # Indentation issues (handled by formatter)
  "E114", # Indentation issues (handled by formatter)
  "E117", # Over-indented (handled by formatter)
]

[tool.ruff.lint.mccabe]
# Flag errors (C901) whenever complexity exceeds 10 (default is 10)
max-complexity = 10

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves these annotations while rebuilding model schemas.
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "TranspilerBaseModel",
  "transpiler_mate.TranspilerBaseModel",
]

[tool.hatch.envs.dev.scripts]
typecheck = "mypy --install-types --non-interactive {args:src}"
lint = "ruff format {args:src tests}"
check = "ruff check --fix {args:src tests}"
security = "bandit -r {args:src}"

[[tool.mypy.overrides]]
module = ["geojson.*", "pygeofilter.*"]
ignore_missing_imports = true
